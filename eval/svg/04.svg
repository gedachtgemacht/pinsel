<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<defs>
  <radialGradient id="bg" cx="0.35" cy="0.35" r="0.9">
    <stop offset="0" stop-color="#4f6670"/>
    <stop offset="0.5" stop-color="#2a3a42"/>
    <stop offset="1" stop-color="#10171b"/>
  </radialGradient>
  <filter id="bgTex" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="2"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.6  0 0 0 0 0.72  0 0 0 0 0.75  1.2 0 0 0 -0.5"/>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <radialGradient id="skin" cx="0.38" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#f0c3a0"/>
    <stop offset="0.45" stop-color="#d79a78"/>
    <stop offset="1" stop-color="#94573e"/>
  </radialGradient>
  <linearGradient id="faceShade" x1="296" y1="0" x2="504" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#fff2e0" stop-opacity="0.18"/>
    <stop offset="0.45" stop-color="#3a1a10" stop-opacity="0"/>
    <stop offset="1" stop-color="#3a1a10" stop-opacity="0.45"/>
  </linearGradient>
  <radialGradient id="ruddy" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#d0604e" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#d0604e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="noseG" cx="0.4" cy="0.35" r="0.7">
    <stop offset="0" stop-color="#f2b496"/>
    <stop offset="0.6" stop-color="#d07a62"/>
    <stop offset="1" stop-color="#9a4e3a"/>
  </radialGradient>
  <linearGradient id="capG" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0" stop-color="#3e5478"/>
    <stop offset="0.5" stop-color="#26385a"/>
    <stop offset="1" stop-color="#121c30"/>
  </linearGradient>
  <pattern id="rib" width="9" height="20" patternUnits="userSpaceOnUse">
    <rect width="9" height="20" fill="#000" opacity="0"/>
    <path d="M1 0 V20" stroke="#0c1424" stroke-width="2" opacity="0.55"/>
    <path d="M5 0 V20" stroke="#6a80a8" stroke-width="1.6" opacity="0.4"/>
  </pattern>
  <pattern id="knit" width="10" height="10" patternUnits="userSpaceOnUse">
    <path d="M0 0 L5 6 L10 0" fill="none" stroke="#0c1424" stroke-width="1.4" opacity="0.5"/>
    <path d="M0 5 L5 11 L10 5" fill="none" stroke="#6a80a8" stroke-width="1" opacity="0.25"/>
  </pattern>
  <linearGradient id="beardG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f4f0ea"/>
    <stop offset="0.5" stop-color="#d4cfc6"/>
    <stop offset="1" stop-color="#8e8980"/>
  </linearGradient>
  <linearGradient id="coat" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f2c84c"/>
    <stop offset="0.45" stop-color="#e0aa2c"/>
    <stop offset="1" stop-color="#8a5e12"/>
  </linearGradient>
  <linearGradient id="sweater" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a4656"/>
    <stop offset="1" stop-color="#1a222c"/>
  </linearGradient>
  <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9a6238"/>
    <stop offset="0.4" stop-color="#6e3e1e"/>
    <stop offset="1" stop-color="#2e170a"/>
  </linearGradient>
  <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe08a"/>
    <stop offset="0.5" stop-color="#ff7a2a"/>
    <stop offset="1" stop-color="#5a1a08"/>
  </radialGradient>
  <filter id="skinTex" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.35" numOctaves="2" seed="6" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.22  0 0 0 0 0.15  0 0 0 0.5 -0.15" result="a"/>
    <feComposite in="a" in2="SourceGraphic" operator="in" result="t"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="t"/></feMerge>
  </filter>
  <filter id="fuzz" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.08 0.02" numOctaves="2" seed="4" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="10" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="smoke" x="-50%" y="-20%" width="200%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="3" seed="12" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feGaussianBlur in="d" stdDeviation="3"/>
  </filter>
  <filter id="b1"><feGaussianBlur stdDeviation="1"/></filter>
  <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="b5" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="b10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  <clipPath id="faceClip">
    <path d="M298 206 C294 270 300 336 318 384 C338 434 370 456 400 458 C430 456 462 434 482 384 C500 336 506 270 502 206 Z"/>
  </clipPath>
  <clipPath id="eyeL"><path d="M334 277 C346 272 368 271 382 276 C368 282 346 283 334 277 Z"/></clipPath>
  <clipPath id="eyeR"><path d="M418 276 C432 271 454 272 466 277 C454 283 432 282 418 276 Z"/></clipPath>
</defs>

