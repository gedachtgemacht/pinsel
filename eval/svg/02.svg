  <path d="M520 452 C550 432 610 428 640 450 C660 466 660 490 650 500 C644 484 630 470 612 466 C590 462 560 466 520 470 Z" opacity="0.95"/>
  <path d="M0 520 C80 494 160 476 240 474 C320 474 390 496 450 520 C380 506 300 492 220 494 C140 498 70 512 0 532 Z" opacity="0.8"/>
