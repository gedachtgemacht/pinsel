  <circle cx="200" cy="420" r="2"/><circle cx="230" cy="430" r="1.5"/><circle cx="510" cy="444" r="2"/><circle cx="530" cy="430" r="1.6"/>
  <circle cx="560" cy="420" r="2.2"/><circle cx="600" cy="424" r="1.5"/><circle cx="650" cy="436" r="1.8"/>
</g>

<!-- rain -->
<rect width="800" height="600" fill="url(#rain)"/>
<rect width="800" height="600" fill="url(#rain2)"/>
<!-- vignette -->
<radialGradient id="vg" cx="0.6" cy="0.35" r="0.85">
  <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
</radialGradient>
<rect width="800" height="600" fill="url(#vg)"/>
</svg>
