<g fill="#0a0c0d" opacity="0.7">
  <path d="M410 460 L452 440 L470 500 L400 510 Z"/>
  <path d="M590 420 L630 410 L650 470 L600 480 Z"/>
  <path d="M680 440 L728 462 L740 520 L690 510 Z"/>
</g>
<g stroke="#7d8a8c" stroke-width="1.2" fill="none" opacity="0.6">
  <path d="M380 436 L420 430 L460 404 L500 398"/><path d="M580 396 L620 380 L660 392"/><path d="M700 418 L740 430 L780 460"/>
</g>

<!-- crashing spray against rocks -->
<g filter="url(#spray)">
  <path d="M300 470 C300 400 340 330 380 300 C400 290 420 300 418 330 C440 300 470 320 460 360 C480 350 500 370 480 400 L440 440 L340 480 Z" fill="#dfeceb" opacity="0.95"/>
  <path d="M640 430 C650 380 690 350 720 360 C740 330 780 340 790 380 C800 400 790 430 770 440 Z" fill="#dfeceb" opacity="0.7"/>
</g>
<g filter="url(#b10)" fill="#e2eeec" opacity="0.35">
  <ellipse cx="390" cy="370" rx="70" ry="60"/><ellipse cx="720" cy="400" rx="60" ry="36"/>
</g>
<!-- spray droplets -->
<g fill="#e6f2f0">
  <circle cx="360" cy="290" r="2"/><circle cx="372" cy="276" r="1.5"/><circle cx="398" cy="270" r="2.2"/><circle cx="420" cy="284" r="1.4"/>
  <circle cx="440" cy="300" r="1.8"/><circle cx="342" cy="306" r="1.6"/><circle cx="410" cy="262" r="1.2"/><circle cx="450" cy="322" r="1.5"/>
    <circle cx="330" cy="330" r="1.3"/><circle cx="352" cy="250" r="1.2"/><circle cx="388" cy="240" r="1.6"/><circle cx="430" cy="252" r="1.1"/>
  <circle cx="458" cy="280" r="1.4"/><circle cx="470" cy="340" r="1.2"/><circle cx="318" cy="370" r="1.5"/><circle cx="384" cy="300" r="1"/>
  <circle cx="676" cy="350" r="1.2"/><circle cx="712" cy="310" r="1.4"/><circle cx="748" cy="306" r="1"/><circle cx="790" cy="320" r="1.3"/>
  <circle cx="700" cy="340" r="1.6"/><circle cx="730" cy="326" r="2"/><circle cx="760" cy="334" r="1.4"/><circle cx="780" cy="350" r="1.8"/>
</g>

<!-- big foreground waves -->
<path d="M0 430 C60 410 120 400 180 410 C240 420 290 440 330 470 C360 492 380 520 400 540 L420 600 L0 600 Z" fill="url(#waveBody)"/>
<path d="M120 404 C180 400 240 418 300 452 C250 440 200 430 150 430 Z" fill="url(#waveGlass)" opacity="0.6"/>
<path d="M0 520 C100 490 200 470 300 480 C380 488 450 510 520 540 C600 570 680 560 800 520 L800 600 L0 600 Z" fill="url(#waveBody)"/>
<!-- curling crest front -->
<path d="M440 522 C500 474 560 452 620 456 C664 470 672 520 650 545 C580 548 500 540 440 522 Z" fill="#1c3638"/>
<path d="M600 486 C620 470 646 480 650 500 C652 520 640 536 620 540 C600 530 590 502 600 486 Z" fill="#2c5250"/>
<path d="M440 520 C470 470 520 440 580 440 C630 440 660 470 650 500 C640 476 610 470 590 480 C570 492 570 520 590 532 C540 540 490 534 440 520 Z" fill="#3e6a68"/>
<path d="M580 440 C630 440 660 470 650 500 C640 476 610 470 590 480 C600 464 596 452 580 440 Z" fill="#a7d2c4" opacity="0.8"/>
