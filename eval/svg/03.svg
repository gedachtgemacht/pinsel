    <path d="M100 420 h50 M330 430 h40 M560 470 h60 M40 520 h70 M300 540 h90 M640 560 h80 M470 580 h60" stroke-width="2.5"/>
  </g>
  <rect y="340" width="800" height="14" fill="#2c3a30" opacity="0.25" filter="url(#b3)"/>
  <!-- sun path -->
  <path d="M220 342 L280 342 L330 600 L170 600 Z" fill="#ffe9c4" opacity="0.18" filter="url(#b8)"/>
</g>

<!-- mist over water -->
<g filter="url(#b8)">
  <ellipse cx="400" cy="342" rx="460" ry="16" fill="#fbf2e8" opacity="0.85"/>
  <ellipse cx="250" cy="360" rx="260" ry="12" fill="#fbf2e8" opacity="0.55"/>
  <ellipse cx="620" cy="372" rx="240" ry="10" fill="#fbf2e8" opacity="0.45"/>
  <ellipse cx="380" cy="320" rx="300" ry="14" fill="#fff" opacity="0.4"/>
</g>
<g mask="url(#fogMask)"><rect y="260" width="800" height="160" fill="#fff" filter="url(#fogTex)" opacity="0.55"/></g>

<!-- foreground shore left -->
<path d="M0 470 C40 462 90 470 130 486 C170 500 200 520 240 540 C280 560 320 580 360 600 L0 600 Z" fill="url(#shore)"/>
<g>
  <path d="M30 488 C40 462 80 456 110 470 C130 480 134 500 120 510 C90 520 50 516 30 504 Z" fill="url(#stone)"/>
  <path d="M40 480 C56 466 82 464 100 472" stroke="#d4cbb8" stroke-width="2" fill="none" opacity="0.6"/>
