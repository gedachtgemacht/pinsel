<!-- lake -->
<g clip-path="url(#lakeClip)">
  <rect y="340" width="800" height="260" fill="#6f8796"/>
  <use href="#above" transform="matrix(1 0 0 -1 0 681)" filter="url(#ripple)" opacity="0.92"/>
  <rect y="340" width="800" height="260" fill="url(#water)"/>
  <!-- ripple highlights -->
  <g stroke="#fff3df" stroke-linecap="round" fill="none" filter="url(#b1)">
    <path d="M190 360 h26 M232 364 h14 M300 370 h20 M226 384 h40 M280 388 h18 M420 366 h22 M520 378 h16 M150 402 h30 M360 408 h22 M600 396 h18" stroke-width="1.2" opacity="0.55"/>
    <path d="M60 440 h44 M120 444 h20 M262 456 h36 M480 448 h40 M540 452 h22 M626 430 h30 M190 488 h56 M260 494 h24 M430 506 h40 M610 520 h50 M680 526 h20" stroke-width="1.8" opacity="0.4"/>
