    <path d="M458 340 l-6 6 M464 360 l-7 5 M462 384 l-6 4 M454 404 l-7 5 M444 422 l-6 4" stroke="#c9bfd6" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <!-- fur strokes -->
    <g stroke="#f7a862" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M380 340 q6 8 14 10"/><path d="M370 360 q6 8 14 10"/><path d="M360 382 q8 6 16 8"/>
      <path d="M392 330 q6 6 12 8"/><path d="M402 360 q6 6 12 6"/><path d="M386 384 q8 6 16 6"/>
      <path d="M352 410 q8 4 14 4"/><path d="M412 386 q6 6 10 6"/>
    </g>
    <g stroke="#8a3517" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.6">
      <path d="M396 410 q8 6 12 12"/><path d="M404 430 q6 8 8 14"/><path d="M358 440 q6 8 12 10"/>
      <path d="M372 470 q8 4 16 4"/><path d="M420 404 q4 6 6 12"/>
    </g>
  </g>
  <!-- hind paw -->
  <path d="M356 486 C370 480 398 482 414 486 C420 490 418 496 410 497 L362 497 C352 496 350 490 356 486 Z" fill="#2a1914"/>
  <!-- front leg -->
  <path d="M436 418 C434 440 432 466 430 486 C428 494 440 497 458 495 C462 491 458 486 450 485 C450 466 452 440 456 414 Z" fill="url(#legG)"/>
  <path d="M440 488 l0 6 M446 488 l0 6" stroke="#4a3430" stroke-width="1"/>
  <!-- tail -->
  <g filter="url(#furTex)">
    <path d="M338 430 C296 444 286 494 330 506 C380 516 452 510 498 500 C516 496 520 484 506 478 C470 484 400 490 370 478 C346 468 340 450 346 432 Z" fill="url(#tailG)"/>
    <path d="M470 484 C484 482 498 478 506 478 C520 484 516 496 498 500 C484 503 470 504 456 505 C466 498 468 490 470 484 Z" fill="url(#whiteFur)"/>
  </g>
  <path d="M300 470 C306 494 330 504 370 506" fill="none" stroke="#ffc69a" stroke-width="3" opacity="0.6" filter="url(#blur1)"/>
  <path d="M336 500 C380 506 430 504 470 498" fill="none" stroke="#7d3214" stroke-width="2" opacity="0.5"/>
  <g stroke="#f6a35c" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.8">
    <path d="M318 470 q10 6 20 6"/><path d="M330 488 q12 4 22 2"/><path d="M370 490 q12 4 22 2"/>
    <path d="M410 494 q12 2 22 0"/><path d="M310 452 q8 6 16 8"/>
  </g>

  <!-- head -->
  <path d="M412 300 C408 284 414 272 424 268 L418 226 L446 260 C450 259 454 260 456 262 L474 226 L478 274 C482 280 492 294 502 306 C505 311 502 316 496 317 C484 320 472 324 463 331 C448 334 428 326 412 300 Z" fill="url(#fur)" filter="url(#furTex)"/>
  <!-- back ear inner -->
