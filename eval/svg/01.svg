  <g clip-path="url(#bodyClip)">
    <!-- haunch shading -->
    <ellipse cx="372" cy="448" rx="52" ry="46" fill="#a2461d" opacity="0.55" filter="url(#blur6)"/>
    <path d="M346 410 C360 396 392 396 410 420 C420 440 416 470 400 488" fill="none" stroke="#7a3216" stroke-width="4" opacity="0.28" filter="url(#blur2)"/>
    <!-- rim light on back -->
    <path d="M410 302 C390 318 352 352 338 400 C326 436 330 470 350 486" fill="none" stroke="#ffc69a" stroke-width="6" opacity="0.75" filter="url(#blur2)"/>
    <!-- white chest -->
