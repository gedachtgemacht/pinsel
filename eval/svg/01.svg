<!-- FOX -->
<g id="fox">
  <!-- back front leg -->
  <path d="M418 420 L414 486 C414 492 424 494 436 492 C438 488 434 485 430 484 L436 420 Z" fill="url(#legG)" opacity="0.9"/>
  <!-- body -->
